<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="eggBody" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="40%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#F5B800"/>
    </radialGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#B8E0F6"/>
      <stop offset="100%" stop-color="#87CEEB"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <g transform="translate(256 280)" filter="url(#softShadow)">
