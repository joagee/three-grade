          stroke="#E5B800" stroke-width="3"/>

    <ellipse cx="-50" cy="-110" rx="42" ry="28" fill="#FFFFFF" opacity="0.55"/>

    <ellipse cx="-44" cy="-28" rx="22" ry="26" fill="#2A2A2A"/>
    <ellipse cx="44"  cy="-28" rx="22" ry="26" fill="#2A2A2A"/>
    <circle  cx="-36" cy="-38" r="7"  fill="#FFFFFF"/>
    <circle  cx="52"  cy="-38" r="7"  fill="#FFFFFF"/>

    <path d="M -22 30 Q 0 56, 22 30"
          stroke="#2A2A2A" stroke-width="6" fill="none" stroke-linecap="round"/>

    <g fill="#F5B800">
      <ellipse cx="-32" cy="180" rx="28" ry="10"/>
      <ellipse cx="32"  cy="180" rx="28" ry="10"/>
    </g>
  </g>
</svg>
